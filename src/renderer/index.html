<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- #card is the drag surface; interactive children opt out individually. -->
  <div id="card" class="card">
    <div class="glow" aria-hidden="true"></div>

    <header id="bar" class="bar">
      <span id="status" class="status" aria-hidden="true">
        <span class="status-ring"></span>
        <span class="status-dot"></span>
      </span>

      <span class="title">
        <span id="headline" class="headline">Starting&hellip;</span>
        <span id="subline" class="subline"></span>
      </span>

      <!-- Rolling 5h budget, as a ring so it reads at a glance when collapsed. -->
      <span id="gauge" class="gauge no-drag" title="Rolling 5-hour token usage">
        <svg viewBox="0 0 36 36" width="26" height="26" aria-hidden="true">
          <circle class="gauge-track" cx="18" cy="18" r="15.5" />
          <circle id="gauge-arc" class="gauge-arc" cx="18" cy="18" r="15.5" />
        </svg>
        <span id="gauge-label" class="gauge-label mono"></span>
      </span>

      <button id="toggle" class="icon-btn no-drag" title="Expand or collapse" aria-label="Expand or collapse">
        <svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
          <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="close" class="icon-btn no-drag" title="Hide (tray icon brings it back)" aria-label="Hide">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M1 1l8 8M9 1l-8 8" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div id="body" class="body">
      <div id="alerts" class="alerts"></div>
      <div id="sessions" class="sessions"></div>

      <div class="usage">
        <div class="usage-head">
          <span class="usage-label">Last 5h</span>
          <span id="usage-value" class="usage-value mono">&ndash;</span>
        </div>
        <!-- Token burn over the window: where the budget actually went. -->
        <div id="spark" class="spark"></div>
      </div>

      <footer id="footer" class="footer hidden"></footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
